<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <div class="brand-logo">
        <mat-icon>account_balance_wallet</mat-icon>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to your Expense Splitter account</p>
    </mat-card-header>

    <mat-card-content>
      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput id="email" name="email" type="email" formControlName="email" placeholder="Enter your email" label="email" />
          <mat-error *ngIf="f['email'].hasError('required')"> Email is required </mat-error>
          <mat-error *ngIf="f['email'].hasError('email')"> Please enter a valid email </mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill" class="full-width">
          <mat-label>Password</mat-label>
          <input
            matInput
            id="password"
            name="password"
            type="password"
            formControlName="password"
            placeholder="Enter your password"
            label="password"
          />
          <mat-error *ngIf="f['password'].hasError('required')"> Password is required </mat-error>
          <mat-error *ngIf="f['password'].hasError('minlength')">
            Password must be at least 6 characters
          </mat-error>
        </mat-form-field>

        <button
          mat-raised-button
          color="primary"
          class="full-width login-button"
          type="submit"
          [disabled]="loading"
        >
          <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
          <span *ngIf="!loading">Sign In</span>
        </button>
      </form>

      <div class="auth-footer">
        <p>Don't have an account? <a routerLink="/auth/register">Create one</a></p>
      </div>
    </mat-card-content>
  </mat-card>
</div>
