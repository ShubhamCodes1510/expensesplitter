# ====================
# Server Configuration
# ====================
server.port=8080

# ====================
# Database Configuration (MySQL)
# ====================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_splitter?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====================
# JPA / Hibernate Configuration
# ====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ====================
# File Upload Configuration
# ====================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB

# ====================
# JWT Configuration
# ====================
app.jwt.secret=${JWT_SECRET:9b04dc6a-5ee5-4ff0-ac55-617e3b96496070f6700d-6e94-495b-8af7-e2c51523b8d4}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ====================
# File Storage Path
# ====================
app.upload.path=uploads/

# ====================
# Logging Configuration
# ====================
logging.level.root=INFO
logging.level.com.expense.expensesplitter=INFO
logging.file.name=logs/expense-splitter.log

# ====================
# Actuator Configuration
# ====================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ====================
# Email Configuration
# ====================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:}
spring.mail.password=${EMAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ====================
# Swagger/OpenAPI Configuration
# ====================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html